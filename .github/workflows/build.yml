name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"
      - name: Build with Gradle
        run: gradle build --no-daemon
      - name: Check jar name
        run: |
          ls -l build/libs
          test -f "build/libs/fpsdisplay-4.1.2.1+1.21.1.jar"
      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: fpsdisplay-4.1.2.1+1.21.1
          path: build/libs/fpsdisplay-4.1.2.1+1.21.1.jar
          if-no-files-found: error
